name: Publish existing PKR110 6.6.89 build

on:
  push:
    branches:
      - selinux-hide-fix-pkr110-6.6.89
    paths:
      - '.github/workflows/publish-existing-pkr110-6.6.89.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Guard, verify and publish the compiled AK3
    runs-on: ubuntu-24.04
    steps:
      - name: Download the successful kernel-build artifact
        uses: actions/download-artifact@v4
        with:
          name: AK3_OP-ACE-5-PRO-6.6.89_OOS16_android15-6.6.89_ReSukiSU_35262_SuSFS_v2.4.0.zip
          run-id: 44198079004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Add PKR110 guard and validate the AK3 package
        id: package
        run: |
          set -euo pipefail
          mapfile -t zips < <(find incoming -type f -name '*.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one downloaded AK3 ZIP, found ${#zips[@]}"
            find incoming -maxdepth 3 -type f -printf '%p %s bytes\\n'
            exit 1
          fi

          INPUT="${zips[0]}"
          INPUT_SHA=$(sha256sum "$INPUT" | awk '{print $1}')
          EXPECTED_INPUT_SHA=2d4d0a85c9310b2a6a89f41242dd05347f7594bc3e3e8f4e2cedf9f9efdd4d74
          if [ "$INPUT_SHA" != "$EXPECTED_INPUT_SHA" ]; then
            echo "::error::Downloaded artifact SHA mismatch: $INPUT_SHA"
            exit 1
          fi

          mkdir -p release-assets
          OUT="release-assets/AK3_OP-ACE-5-PRO-6.6.89_OOS16_android15-6.6.89_ReSukiSU_35262_SuSFS_v2.4.0_PKR110-guarded.zip"
          python3 - "$INPUT" "$OUT" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import stat, sys

          src, dst = map(Path, sys.argv[1:3])
          guard = """# PKR110 device guard (OnePlus Ace 5 Pro / codename hummer).
          # Verified handset properties: model=PKR110, device=OP60EBL1, build.product=PKR110.
          DEVICE_MODEL="$(getprop ro.product.model 2>/dev/null)"
          DEVICE_NAME="$(getprop ro.product.device 2>/dev/null)"
          BUILD_PRODUCT="$(getprop ro.build.product 2>/dev/null)"
          VENDOR_DEVICE="$(getprop ro.product.vendor.device 2>/dev/null)"
          SYSTEM_DEVICE="$(getprop ro.product.system.device 2>/dev/null)"
          DEVICE_ID=" $DEVICE_MODEL $DEVICE_NAME $BUILD_PRODUCT $VENDOR_DEVICE $SYSTEM_DEVICE "
          case "$DEVICE_ID" in
              *" PKR110 "*|*" OP60EBL1 "*|*" hummer "*)
                  ui_print "  -> Device check: OnePlus Ace 5 Pro (PKR110)"
                  ;;
              *)
                  abort "Unsupported device. This kernel is only for OnePlus Ace 5 Pro (PKR110)."
                  ;;
          esac
          """
          with ZipFile(src, "r") as zin:
              bad = zin.testzip()
              if bad:
                  raise SystemExit(f"source ZIP CRC failure: {bad}")
              required = {
                  "Image",
                  "anykernel.sh",
                  "tools/ak3-core.sh",
                  "META-INF/com/google/android/update-binary",
              }
              missing = required - set(zin.namelist())
              if missing:
                  raise SystemExit(f"missing required AK3 entries: {sorted(missing)}")
              image = zin.read("Image")
              if len(image) < 10_000_000 or image[0x38:0x3c] != b"ARM\\x64":
                  raise SystemExit("Image is not a valid ARM64 Linux Image")
              if b"6.6.89-android15-OP-RESUKISU-1alissi" not in image:
                  raise SystemExit("Image does not contain the expected 6.6.89 kernel release string")
              script = zin.read("anykernel.sh").decode("utf-8")
              needle = ". tools/ak3-core.sh\\n"
              if script.count(needle) != 1 or "PKR110 device guard" in script:
                  raise SystemExit("AnyKernel script anchor mismatch or duplicate device guard")
              script = script.replace(
                  needle,
                  needle + "\\n# PKR110 device guard\\n" + guard,
                  1,
              )
              with ZipFile(dst, "w") as zout:
                  zout.comment = zin.comment
                  for info in zin.infolist():
                      data = zin.read(info.filename)
                      if info.filename == "anykernel.sh":
                          data = script.encode("utf-8")
                      zout.writestr(info, data)
                  meta = ZipInfo("DEVICE_TARGET.txt", date_time=(2026, 11, 18, 8, 0, 0))
                  meta.compress_type = ZIP_DEFLATED
                  meta.external_attr = (stat.S_IFREG | 0o644) << 16
                  zout.writestr(
                      meta,
                      "Device: OnePlus Ace 5 Pro\\n"
                      "Model: PKR110\\n"
                      "Codename: hummer\\n"
                      "Observed handset properties: ro.product.model=PKR110; ro.product.device=OP60EBL1; ro.build.product=PKR110\\n"
                      "Kernel: 6.6.89-android15-OP-RESUKISU-1alissi\\n"
                      "Root: ReSukiSU/BakaSU build 35262\\n"
                      "SUSFS: v2.4.0\\n"
                      "SELinux Hide: KernelSU fixes #3969 and #3981 port applied; selinux_hide.o compiled. Device runtime test pending.\\n",
                  )

          with ZipFile(dst, "r") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"output ZIP CRC failure: {bad}")
              check = z.read("anykernel.sh").decode("utf-8")
              if "PKR110 device guard" not in check or 'block=boot' not in check or 'is_slot_device=auto' not in check:
                  raise SystemExit("device guard or AK3 boot target verification failed")
              if "Unsupported device." not in check:
                  raise SystemExit("missing fail-closed device mismatch behavior")
          print(f"verified {dst} ({dst.stat().st_size} bytes)")
          PY

          unzip -tq "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          printf '%s  %s\\n' "$SHA" "$(basename "$OUT")" > "$OUT.sha256"
          cat > release-assets/SELINUX_HIDE_FIX.txt <<'EOF'
          PKR110 / OnePlus Ace 5 Pro, Android 16 / OOS16
          Kernel image: 6.6.89-android15-OP-RESUKISU-1alissi
          Kernel source: OnePlusOSS android_kernel_common_oneplus_sm8750
            f4dd5c0457798af7e2e9cf5a6edce3447947d067
          Device modules / device tree:
            07ce6f1167c66f7225795ee718fe1d0b5d56db44
          ReSukiSU/BakaSU source:
            7b65bde0710b5e7c6f755545cb15a4abd417f3a8
          SELinux Hide port:
            KernelSU #3969 and #3981 policy-pair port
          Build log confirms patch application and successful compilation of
          drivers/kernelsu/feature/selinux_hide.o.
          SUSFS: v2.4.0
          The package includes an AnyKernel pre-flash model guard for PKR110,
          OP60EBL1 or hummer. Runtime SELinux behavior has not yet been tested
          on the handset.
          EOF

          echo "zip_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="pkr110-6.6.89-selinux-hide-35262-verified"
          cat > release-notes.md <<EOF
          OnePlus Ace 5 Pro (PKR110 / hummer), OxygenOS 16.

          - Kernel: 6.6.89-android15-OP-RESUKISU-1alissi
          - ReSukiSU/BakaSU build: 35262
          - SUSFS: v2.4.0
          - SELinux Hide: policy-pair port of KernelSU #3969 and #3981; patch application and object compilation are confirmed in the build log.
          - Installer: AnyKernel3, boot partition, automatic slot selection, with a PKR110/OP60EBL1/hummer device guard.

          Original Actions artifact SHA-256: 2d4d0a85c9310b2a6a89f41242dd05347f7594bc3e3e8f4e2cedf9f9efdd4d74
          Guarded package SHA-256: $ZIP_SHA256

          Device runtime testing of the SELinux detector has not yet been performed. Keep the existing boot_a/boot_b backups and verify the current ROM and device before flashing.
          EOF

          gh release create "$TAG" "$ZIP_PATH" "$ZIP_PATH.sha256" release-assets/SELINUX_HIDE_FIX.txt \\
            --repo "$GITHUB_REPOSITORY" \\
            --title "PKR110 6.6.89 - SELinux Hide fixes #3969 + #3981" \\
            --notes-file release-notes.md
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $ZIP_SHA256" >> "$GITHUB_STEP_SUMMARY"
